<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek 网页增强</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="panel">
    <header class="header">
      <div class="header-main">
        <div class="title-wrap">
          <span class="status-dot" id="statusDot"></span>
          <span class="title">DeepSeek 网页增强</span>
        </div>
        <span class="version">v1.4</span>
      </div>
      <div class="stat-bar" id="statBar">正在读取当前页面…</div>
    </header>

    <section class="card">
      <div class="section-title">⚡ 原生渲染与滚动修复</div>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">关闭虚拟列表卸载（全量静态渲染）</span>
          <span class="rule-desc">所有消息常驻 DOM，彻底解决滚动跳动、掉帧闪烁与 Ctrl+F 搜不到上文</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="staticRender" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">流式生成防强制抢滚</span>
          <span class="rule-desc">回答生成中向上滚轮阅读上文时，禁止页面自动把你拽回底部</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="scrollGuard" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">右上角快捷控制胶囊</span>
          <span class="rule-desc">在页面顶栏右侧显示宽度切换与一键折叠思考按钮</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="showTopBar" />
            <span class="slider"></span>
          </label>
        </div>
      </label>
    </section>

    <section class="card">
      <div class="section-title">🧠 思维链</div>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">默认收起</span>
          <span class="rule-desc">打开页面时，已完成思考的块自动折叠</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="collapseDefault" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">生成完成自动收起</span>
          <span class="rule-desc">思考结束、正文开始时自动折叠</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="autoCollapseOnDone" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">记住每条展开状态</span>
          <span class="rule-desc">你手动展开过的，刷新后仍然展开</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="rememberState" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <div class="btn-row">
        <button class="btn btn-primary" id="collapseAllBtn">全部折叠</button>
        <button class="btn btn-outline" id="expandAllBtn">全部展开</button>
      </div>
    </section>

    <section class="card">
      <div class="section-title">∑ LaTeX 公式</div>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">渲染 \[...\] 与 \(...\)</span>
          <span class="rule-desc">把 DeepSeek 当成普通文字显示的公式重新渲染</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="latexConvert" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <label class="rule-row">
        <div class="rule-info">
          <span class="rule-name">复制公式得 LaTeX 源码</span>
          <span class="rule-desc">选中公式任意片段，复制出完整源码</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="latexCopy" />
            <span class="slider"></span>
          </label>
        </div>
      </label>

      <label class="rule-row sub-row">
        <div class="rule-info">
          <span class="rule-name">复制时带 $ 定界符</span>
          <span class="rule-desc">行内 $…$，块级 $$…$$</span>
        </div>
        <div class="rule-right">
          <label class="switch">
            <input type="checkbox" data-key="copyWithDelimiters" />
            <span class="slider"></span>
          </label>
        </div>
      </label>
    </section>

    <footer class="footer">100% 原生页面原地增强 · 保留上传图片/分支切换全部功能</footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
